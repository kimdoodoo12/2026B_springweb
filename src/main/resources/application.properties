spring.application.name=springweb

# .properties 파일의 주석 방법
# application.properties 파일이란? spring 관련 설정 코드 입력하는 곳

# 1. 내장톰캣의 포트번호 변경 가능, 기본값 8080
server.port=8080

# 2. 데이터베이스연동
# 2-1: 연동할 DB 주소
spring.datasource.url = jdbc:mysql://localhost:3306/mydb0902
# 2-2: db주소의 계정명/비밀번호
spring.datasource.username=root
spring.datasource.password=1234
